{% extends "base.html" %}

{% block title %}Zmiana hasła{% endblock %}

{% block content %}

<div class="container py-3" style="max-width: 480px;">

    <h1 class="fw-bold mb-4">
        Zmiana hasła
    </h1>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
            <label for="current_password" class="form-label">
                Aktualne hasło
            </label>
            <input
                type="password"
                class="form-control"
                id="current_password"
                name="current_password"
                required
                autocomplete="current-password"
            >
        </div>

        <div class="mb-3">
            <label for="new_password" class="form-label">
                Nowe hasło (min. 5 znaków)
            </label>
            <input
                type="password"
                class="form-control"
                id="new_password"
                name="new_password"
                required
                minlength="5"
                autocomplete="new-password"
            >
        </div>

        <div class="mb-4">
            <label for="new_password2" class="form-label">
                Powtórz nowe hasło
            </label>
            <input
                type="password"
                class="form-control"
                id="new_password2"
                name="new_password2"
                required
                minlength="5"
                autocomplete="new-password"
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Zmień hasło
        </button>

    </form>

    <div class="mt-3">
        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary w-100">
            ← Powrót
        </a>
    </div>

</div>

{% endblock %}
